    <title>Document</title>
    <script>
        //.6. Leia 6 notas válidas (de 0 a 10), calcule e exiba a média simples.

let somaNotas = 0;
const totalNotas = 6;

for (let i = 1; i <= totalNotas; i++) {
  let nota = parseFloat(prompt(`Digite a ${i}ª nota (de 0 a 10):`));

  while (isNaN(nota) || nota < 0 || nota > 10) {
    alert("Nota inválida! Digite um número de 0 a 10.");
    nota = parseFloat(prompt(`Digite novamente a ${i}ª nota (de 0 a 10):`));
  }
  somaNotas += nota;
}
const media = somaNotas / totalNotas;

alert(`A média das 6 notas é: ${media.toFixed(2)}`);
console.log(`Média final: ${media.toFixed(2)}`);
    </script>
