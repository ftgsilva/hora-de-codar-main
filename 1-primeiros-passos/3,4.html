<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //3.4. Leia dois inteiros (sendo o primeiro menor que o segundo)
        //  e calcule a média desses números e de todos os inteiros entre eles.

let num1 = parseInt(prompt("Digite o primeiro número (menor):"));
let num2 = parseInt(prompt("Digite o segundo número (maior):"));


while (num1 >= num2) {
  alert("O primeiro número precisa ser estritamente menor que o segundo!");
  num1 = parseInt(prompt("Digite novamente o primeiro número (menor):"));
  num2 = parseInt(prompt("Digite novamente o segundo número (maior):"));
}

let soma = 0;
let quantidade = 0;

for (let i = num1; i <= num2; i++) {
  soma = soma + i;     
  quantidade++;       
}
const media = soma / quantidade;

alert(`A média aritmética de ${num1} até ${num2} é: ${media.toFixed(2)}`);
console.log(`Soma: ${soma} | Quantidade: ${quantidade} | Média: ${media}`);

    </script>
</head>
