    <script>
        //3.9. Leia 10 valores e informe quantos estão no intervalo de 24 a 42 (inclusive) e quantos estão fora.

        let dentro = 0;
let fora = 0;

for (let i = 1; i <= 10; i++) {
  const valor = parseFloat(prompt(`Digite o ${i}º valor (de 10):`));

  if (valor >= 24 && valor <= 42) {
    dentro++;
  } else {
    fora++;
  }
}

alert(`Resultado:\nValores dentro do intervalo [24, 42]: ${dentro}\nValores fora do intervalo: ${fora}`);
console.log(`Dentro: ${dentro} | Fora: ${fora}`);
    </script>
