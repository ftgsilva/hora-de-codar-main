<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //2.4. Leia 3 valores diferentes e mostre a soma dos 2 maiores.

        const num1 = parseFloat(prompt("Informe o primeiro número:"));
        const num2 = parseFloat(prompt("Informe o segundo número:"));
        const num3 = parseFloat(prompt("Informe o terceiro número:"));

        // Se o num3 for o menor, os maiores são num1 e num2
        if (num3 < num1 && num3 < num2) {
            alert(`A soma dos dois maiores números é: ${num1 + num2}`);
        }
        // Se o num2 for o menor, os maiores são num1 e num3
        else if (num2 < num1 && num2 < num3) {
            alert(`A soma dos dois maiores números é: ${num1 + num3}`);
        }
        // Se não for nenhum dos anteriores, o num1 é o menor, sobram num2 e num3
        else {
            alert(`A soma dos dois maiores números é: ${num2 + num3}`);
        }


    </script>
</head>
