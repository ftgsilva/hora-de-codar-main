<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //3.5. Leia 2 notas de um aluno, calcule a média final e considere aprovação com nota 9,5
        // . Em seguida, pergunte: `Calcular a média de outro aluno? (S/N)`
        // . Se a resposta for `S`, repita; caso contrário, encerre e mostre a quantidade de alunos aprovados.

        let alunosAprovados = 0;
        let resposta = "S";

        while (resposta.toUpperCase() === "S") {
            const nota1 = parseFloat(prompt("Digite a primeira nota do aluno:"));
            const nota2 = parseFloat(prompt("Digite a segunda nota do aluno:"));

            const media = (nota1 + nota2) / 2;

          
            if (media >= 9.5) {
                alunosAprovados++;
                alert(`Média: ${media.toFixed(1)} - Aluno APROVADO!`);
            } else {
                alert(`Média: ${media.toFixed(1)} - Aluno NÃO aprovado.`);
            }
         
            resposta = prompt("Calcular a média de outro aluno? (S/N)");
        }

        alert(`Programa encerrado!\nTotal de alunos aprovados: ${alunosAprovados}`);
        console.log(`Total de aprovados: ${alunosAprovados}`);
    </script>
</head>

</html>
